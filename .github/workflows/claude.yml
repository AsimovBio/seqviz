name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

env:
  GITHUB_TOKEN: ${{ github.token }}
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Tool permissions for Claude Code CLI
          # Note: git push is excluded - the action handles pushing via its own mechanism
          claude_args: |
            --model claude-opus-4-5-20251101
            --allowedTools "Edit,Write,Read,Grep,Glob,View,LS,MultiEdit,WebFetch,WebSearch,Task,TodoRead,TodoWrite,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(gh:*),Bash(git status:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git branch:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(git --no-pager:*),Bash(git ls-files:*),Bash(git blame:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(find:*),Bash(grep:*),Bash(rg:*),Bash(wc:*),Bash(sort:*),Bash(uniq:*),Bash(xargs:*),Bash(echo:*),Bash(pwd),Bash(which:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(touch:*),Bash(sed:*),Bash(awk:*),Bash(cut:*),Bash(tr:*),Bash(jq:*),Bash(diff:*),Bash(env),Bash(test:*),Bash([:*),Bash(true),Bash(false),Bash(date:*),Bash(realpath:*),Bash(dirname:*),Bash(basename:*),Bash(stat:*),Bash(tree:*),Bash(tee:*),Bash(mktemp:*)"

